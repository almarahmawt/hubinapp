version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hubin_app
    restart: always
    env_file:
      - .env.docker
    volumes:
      - ./storage:/var/www/storage
      # DITAMBAHKAN: Menimpa file .env di dalam container dengan .env.docker
      - ./.env.docker:/var/www/.env
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: hubin_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: hubin_db
    restart: always
    # DITAMBAHKAN: Mengambil variabel DB_* dari .env.docker
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
    driver: local